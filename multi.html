<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-éditeur radio — micro:bit V2</title>
  <!-- Multi-editeur radio : deux editeurs complets (index.html?editeur=1 et ?editeur=2) cote a cote. Leurs simulations
       communiquent par radio grace a un BroadcastChannel (un.js, simu_radio*) : un message envoye par une carte arrive
       sur l'autre si sa radio est allumee sur le meme groupe et le meme canal. Chaque editeur garde ses donnees a part
       (petit script en tete de index.html). Rien ne sort du navigateur. -->
  <style>
    :root { --bandeau: #d94700; --fond: #1b1c1f; --texte: #f5f5f5; --doux: #ffe3d3; --poignee: #3c3f45; }
    :root[data-theme="light"] { --bandeau: #ff5501; --fond: #e8e8e8; --poignee: #b8b8b8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fond); font-family: 'Segoe UI', Arial, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    #entete { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: var(--bandeau); color: var(--texte); }
    #entete h1 { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; }
    #entete p { margin: 0; font-size: 12.5px; color: var(--doux); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #entete button, #entete a { flex-shrink: 0; font: inherit; font-size: 12.5px; color: #fff; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.35);
      border-radius: 5px; padding: 4px 10px; cursor: pointer; text-decoration: none; }
    #entete button:hover, #entete a:hover { background: rgba(255,255,255,0.28); }
    #cartes { flex: 1; display: flex; min-height: 0; }
    .carte { flex: 1 1 50%; min-width: 360px; border: 0; display: block; height: 100%; background: var(--fond); }
    #poignee { flex: 0 0 8px; cursor: col-resize; background: var(--poignee); position: relative; touch-action: none; }
    #poignee:hover, #poignee.actif { background: #cf4400; }
    #poignee::after { content: ''; position: absolute; left: 3px; top: 50%; width: 2px; height: 40px; margin-top: -20px; background: rgba(255,255,255,0.55); border-radius: 1px; }
    body.glisse .carte { pointer-events: none; }   /* pendant le glisser, les iframes ne capturent pas le pointeur */
    body.glisse { cursor: col-resize; user-select: none; }
  </style>
  <script>
    try { if (localStorage.getItem('themeApp') === 'light') document.documentElement.dataset.theme = 'light'; } catch (erreur) { /* rien */ }
  </script>
</head>
<body>
  <header id="entete">
    <h1>📡 Multi-éditeur radio</h1>
    <p>Deux cartes micro:bit simulées : un message envoyé par l'une arrive sur l'autre si sa radio est allumée sur le même groupe.</p>
    <button id="moitie" type="button" title="Remettre les deux éditeurs à la même largeur (double-clic sur la poignée)">⇔ Moitié-moitié</button>
    <a href="index.html" title="Revenir à un seul éditeur">Éditeur simple</a>
  </header>
  <main id="cartes">
    <iframe class="carte" id="carte1" src="index.html?editeur=1" title="Carte 1 : éditeur et simulateur"></iframe>
    <div id="poignee" role="separator" aria-orientation="vertical" aria-label="Largeur des deux éditeurs" tabindex="0"></div>
    <iframe class="carte" id="carte2" src="index.html?editeur=2" title="Carte 2 : éditeur et simulateur"></iframe>
  </main>
  <script>
    (function () {
      const poignee = document.getElementById('poignee'), c1 = document.getElementById('carte1'), c2 = document.getElementById('carte2');
      const zone = document.getElementById('cartes');
      const CLE = 'multi_largeur_v1';
      function poser(part) {   // part de la carte 1, entre 20 % et 80 %
        part = Math.max(0.2, Math.min(0.8, part));
        c1.style.flex = '0 0 ' + (part * 100) + '%';
        c2.style.flex = '1 1 0';
        try { localStorage.setItem(CLE, String(part)); } catch (erreur) { /* rien */ }
      }
      try { const p = Number(localStorage.getItem(CLE)); if (p) poser(p); } catch (erreur) { /* rien */ }
      poignee.addEventListener('pointerdown', ev => {
        poignee.setPointerCapture(ev.pointerId);
        poignee.classList.add('actif'); document.body.classList.add('glisse');
      });
      poignee.addEventListener('pointermove', ev => {
        if (!poignee.hasPointerCapture(ev.pointerId)) return;
        const r = zone.getBoundingClientRect();
        poser((ev.clientX - r.left) / r.width);
      });
      // Blockly ne voit pas seul que sa place a change : on le previent dans chaque carte.
      const prevenir = () => { for (const c of [c1, c2]) { try { c.contentWindow.dispatchEvent(new Event('resize')); } catch (erreur) { /* rien */ } } };
      const finir = ev => {
        if (ev.pointerId >= 0 && poignee.hasPointerCapture(ev.pointerId)) poignee.releasePointerCapture(ev.pointerId);
        poignee.classList.remove('actif'); document.body.classList.remove('glisse');
        prevenir();
      };
      poignee.addEventListener('pointerup', finir);
      poignee.addEventListener('pointercancel', finir);
      poignee.addEventListener('keydown', ev => {
        const pas = ev.key === 'ArrowLeft' ? -0.05 : ev.key === 'ArrowRight' ? 0.05 : 0;
        if (!pas) return;
        poser(c1.getBoundingClientRect().width / zone.getBoundingClientRect().width + pas);
        ev.preventDefault(); finir({ pointerId: -1 });
      });
      const moitie = () => { poser(0.5); finir({ pointerId: -1 }); };
      poignee.addEventListener('dblclick', moitie);
      document.getElementById('moitie').addEventListener('click', moitie);    })();
  </script>
</body>
</html>
