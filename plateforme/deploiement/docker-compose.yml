# Plateforme + relais HTTPS Caddy. Depuis la racine du projet :
#   docker compose -f plateforme/deploiement/docker-compose.yml up -d --build
# Premier compte enseignant :
#   docker compose -f plateforme/deploiement/docker-compose.yml exec plateforme python plateforme/serveur.py --creer-enseignant prof@mon-college.fr "Nom affiche"
services:
  plateforme:
    build:
      context: ../..
      dockerfile: plateforme/deploiement/Dockerfile
    restart: unless-stopped
    environment:
      PLATEFORME_CODE_INSCRIPTION: ""          # code d'etablissement pour l'inscription des enseignants (vide = fermee)
      PLATEFORME_NOM: "Programmation micro:bit"
    volumes:
      - donnees:/donnees
    # Pas de port publie : seul Caddy joint la plateforme, par le reseau interne de Docker.

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_donnees:/data
      - caddy_config:/config

volumes:
  donnees:
  caddy_donnees:
  caddy_config:
